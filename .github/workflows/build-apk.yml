name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: استدعاء كود المشروع
        uses: actions/checkout@v4

      - name: إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: إعداد بيئة Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Gradle 8.x in Capacitor usually prefers Java 17

      - name: إعداد أدوات Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت حزم المشروع وبناء نسخة الويب
        run: |
          TARGET_DIR="."
          if [ -d "app/applet" ] && [ -f "app/applet/package.json" ]; then
            TARGET_DIR="app/applet"
          fi
          cd $TARGET_DIR
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx vite build

      - name: تهيئة وتحديث منصة الأندرويد
        run: |
          TARGET_DIR="."
          if [ -d "app/applet" ] && [ -f "app/applet/package.json" ]; then
            TARGET_DIR="app/applet"
          fi
          cd $TARGET_DIR
          
          if [ ! -d "android" ]; then
            echo "Android folder not found, generating via Capacitor..."
            npx cap add android
          else
            echo "Android folder exists, syncing..."
            npx cap sync android
          fi

      - name: إعطاء صلاحيات التشغيل لـ Gradle
        run: |
          TARGET_DIR="android"
          if [ -d "app/applet/android" ]; then
            TARGET_DIR="app/applet/android"
          fi
          cd $TARGET_DIR
          chmod +x gradlew

      - name: تجميع وبناء ملف الـ APK
        run: |
          TARGET_DIR="android"
          if [ -d "app/applet/android" ]; then
            TARGET_DIR="app/applet/android"
          fi
          cd $TARGET_DIR
          ./gradlew assembleDebug --no-daemon

      - name: رفع ملف الـ APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: committee-management-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          retention-days: 14
