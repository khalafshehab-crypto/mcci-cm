name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & Build Web
        run: |
          TARGET_DIR="."
          if [ -d "app/applet" ] && [ -f "app/applet/package.json" ]; then
            TARGET_DIR="app/applet"
          fi
          cd $TARGET_DIR
          
          # Fix capacitor config webDir if it exists
          if [ -f "capacitor.config.ts" ]; then
             sed -i "s/webDir: 'dist'/webDir: 'dist'/g" capacitor.config.ts
          fi
          
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          
          # Build web assets explicitly to dist/
          npx vite build

      - name: Sync Capacitor
        run: |
          TARGET_DIR="."
          if [ -d "app/applet" ] && [ -f "app/applet/package.json" ]; then
            TARGET_DIR="app/applet"
          fi
          cd $TARGET_DIR
          
          # Verify dist exists before sync
          if [ ! -d "dist" ]; then
             echo "dist directory not found, building again..."
             npx vite build
          fi
          
          if [ ! -d "android" ]; then
            echo "Android folder not found, generating via Capacitor..."
            npx cap add android
          else
            echo "Android folder exists, syncing..."
            npx cap sync android || true
          fi

      - name: Set gradlew permissions
        run: |
          TARGET_DIR="android"
          if [ -d "app/applet/android" ]; then
            TARGET_DIR="app/applet/android"
          fi
          cd $TARGET_DIR
          chmod +x gradlew

      - name: Build APK
        run: |
          TARGET_DIR="android"
          if [ -d "app/applet/android" ]; then
            TARGET_DIR="app/applet/android"
          fi
          cd $TARGET_DIR
          
          # Clean and build
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: committee-management-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          retention-days: 14
