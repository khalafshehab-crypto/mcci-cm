name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: استدعاء كود المشروع
        uses: actions/checkout@v4

      - name: إعداد بيئة Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: إعداد بيئة Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: إعداد أدوات Android SDK
        uses: android-actions/setup-android@v3

      - name: بناء نسخة الويب
        run: |
          npm install --legacy-peer-deps
          npx vite build || npm run build -- --no-check || true

      - name: مزامنة إعدادات Capacitor للأندرويد
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android || true
          fi

      - name: ضبط إصدار Gradle على 8.13 وإعطاء الصلاحيات
        run: |
          find . -name "gradle-wrapper.properties" -exec sed -i 's/gradle-[0-9.]*-/gradle-8.13-/g' {} +
          if [ -f "android/gradlew" ]; then chmod +x android/gradlew; fi

      - name: تجميع وبناء ملف الـ APK النهائي
        run: |
          cd android
          ./gradlew clean assembleDebug --no-daemon

      - name: رفع ملف التطبيق الـ APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: committee-management-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          retention-days: 14
