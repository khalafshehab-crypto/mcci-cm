name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً بنقرة زر في أي وقت

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: استدعاء كود المشروع
        uses: actions/checkout@v4

      - name: إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: إعداد بيئة Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: إعداد أدوات Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت حزم المشروع وبناء نسخة الويب
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: تهيئة Capacitor ومنصة الأندرويد
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          
          # تحديد مجلد المخرجات تلقائياً (dist أو build)
          WEB_DIR="dist"
          if [ -d "build" ]; then WEB_DIR="build"; fi
          
          # إنشاء الإعدادات في حال عدم وجودها
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "بوابة اللجان" "sa.gov.mcci.committees" --web-dir $WEB_DIR
          fi
          
          # إضافة الأندرويد أو مزامنتها
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: إعطاء صلاحيات التشغيل لـ Gradle
        run: chmod +x android/gradlew

      - name: تجميع وبناء ملف الـ APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: رفع ملف الـ APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: committee-management-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14